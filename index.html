<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6 pb-20">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b border-slate-800">
      <div>
        <h1 class="text-2xl font-extrabold text-white flex items-center gap-2 tracking-tight">
          💳 Quản Lý Thẻ Tín Dụng Pro
        </h1>
        <p class="text-xs text-slate-400 mt-1">Theo dõi chi tiêu, đếm ngược sao kê & tích thưởng chuyên nghiệp</p>
      </div>
      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <button onclick="openStatsModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-3.5 py-2 rounded-lg text-xs border border-slate-700 transition">
          📊 Thống Kê
        </button>
        <button onclick="openCategoryModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-3.5 py-2 rounded-lg text-xs border border-slate-700 transition">

        <button onclick="openMonthlyHistory()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-3.5 py-2 rounded-lg text-xs border border-slate-700 transition">
          📜 Lịch Sử Tháng

    <!-- Bố cục: Danh Sách Thẻ (3 Cột) | Quy Tắc & Ghi Chú (1 Cột) -->

      <!-- Cột Trái: Danh sách Thẻ Tín Dụng (2 thẻ / 1 hàng) -->

        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <p class="text-slate-400 text-center col-span-2 py-8">Đang tải dữ liệu thẻ từ Firebase...</p>

      <!-- Cột Phải: Quy Tắc & Ghi Chú (Chuẩn kích thước cũ) -->
      <div class="lg:col-span-1 flex flex-col gap-4">
        
        <!-- Mục Quy Tắc -->
        <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700/80 shadow-md">
          <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-2 flex items-center justify-between">
            <span>📌 Quy Tắc Dùng Thẻ</span>
            <button onclick="saveRules()" class="text-[10px] bg-indigo-600/30 text-indigo-300 px-2 py-0.5 rounded border border-indigo-500/40 hover:bg-indigo-600/60 transition">Lưu</button>
          </h2>
          <textarea id="rules-textarea" placeholder="- Gói CAKE lên Premium...&#10;- VIB MAX: MAX CAP 1500k...&#10;- Thẻ VIB: Ưu tiên Ẩm thực..." class="w-full h-[225px] bg-slate-900 border border-slate-700/80 rounded-lg p-2.5 text-xs text-slate-200 outline-none focus:border-indigo-500 resize-none leading-relaxed font-normal"></textarea>
        </div>

        <!-- Mục Ghi Chú Nhanh -->
        <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700/80 shadow-md">
          <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-2 flex items-center justify-between">
            <span>📝 Ghi Chú Nhanh</span>
            <button onclick="saveNotes()" class="text-[10px] bg-amber-600/30 text-amber-300 px-2 py-0.5 rounded border border-amber-500/40 hover:bg-amber-600/60 transition">Lưu</button>
          </h2>
          <textarea id="notes-textarea" placeholder="- Check hoàn 5tr7 của thẻ VIB...&#10;- 14/09/2026: Chèn thẻ VIB MAX...&#10;- Nhắc nộp tiền sao kê..." class="w-full h-[225px] bg-slate-900 border border-slate-700/80 rounded-lg p-2.5 text-xs text-slate-200 outline-none focus:border-amber-500 resize-none leading-relaxed font-normal"></textarea>

  <!-- Modal Thêm/Sửa Thẻ -->
  <div id="modal-add" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">

        <div>

          <input type="text" id="card-name" placeholder="VD: VIB SUPER CARD - 6700" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none">

        <div class="grid grid-cols-2 gap-4">

            <label class="block text-xs font-semibold text-slate-300 mb-1">Mốc Chi Tiêu Toàn Bộ (VNĐ)</label>
            <input type="number" id="card-target" placeholder="10000000" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Mốc Tối Thiểu Để Hoàn (VNĐ)</label>
            <input type="number" id="card-min-target" placeholder="2000000 (Để 0 nếu không yêu cầu)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Ngày Sao Kê (1-31)</label>
            <input type="number" id="card-statement" min="1" max="31" placeholder="20" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Tông Màu Thẻ</label>
            <select id="card-color" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="white_amex">⚪ Trắng Silver AMEX (VIB Super Card)</option>
              <option value="avocado">🥑 Xanh Bơ Avocado Toàn Thẻ (VIB Max Card)</option>
              <option value="black">🖤 Đen VIP Titanium (Black Platinum)</option>
              <option value="blue">💙 Xanh Dương (VIB Standard)</option>
              <option value="purple">💜 Tím (TPBank / VPBank EVO)</option>
              <option value="emerald">💚 Xanh Lá (VPBank S Reward)</option>
              <option value="slate">🩶 Xám Neutral (Mặc định)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Ghi Chú Hoàn Thưởng</label>
          <input type="text" id="card-reward" placeholder="VD: Hoàn Max Cap 500k điểm, trả hàng tuần" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('modal-add')" class="px-4 py-2 text-sm text-slate-400 hover:bg-slate-700 rounded-lg">Hủy</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-500">Lưu Thẻ</button>

  <!-- Modal Quản Lý Sàn / Kênh Quẹt -->
  <div id="modal-categories" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-slate-800 rounded-xl p-6 max-w-md w-full shadow-2xl border border-slate-700 text-slate-100">
      <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">

        <button onclick="addCategory()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-lg text-xs shrink-0">+ Thêm</button>

  <!-- Modal Thống Kê -->
  <div id="modal-stats" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">

      <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
        <h2 class="text-lg font-bold">📊 Thống Kê Chi Tiêu Chi Tiết</h2>
        <button onclick="closeModal('modal-stats')" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
      </div>
      <div id="stats-content" class="space-y-4 overflow-y-auto pr-1 flex-1 text-xs"></div>
    </div>
  </div>

  <!-- Modal Lịch Sử Giao Dịch -->
  <div id="modal-history" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-slate-800 rounded-xl p-6 max-w-lg w-full shadow-2xl border border-slate-700 text-slate-100 max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
        <h2 id="history-modal-title" class="text-lg font-bold">Lịch Sử Giao Dịch</h2>
        <button onclick="closeModal('modal-history')" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
      </div>
      <div id="history-list" class="space-y-2 overflow-y-auto pr-1 flex-1"></div>

  <!-- Modal Lịch Sử Tháng -->
  <div id="modal-monthly" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-slate-800 rounded-xl p-6 max-w-lg w-full shadow-2xl border border-slate-700 text-slate-100 max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
        <h2 class="text-lg font-bold">📜 Lịch Sử Chốt Sổ Các Tháng</h2>
        <button onclick="closeModal('modal-monthly')" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
      </div>
      <div id="monthly-history-list" class="space-y-3 overflow-y-auto pr-1 flex-1"></div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, getDoc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // CẤU HÌNH FIREBASE THỰC TẾ
    const firebaseConfig = {
      apiKey: "AIzaSyCmtLvK0_CZ7EA_zbUjs01lqxN6ifO87Ok",
      authDomain: "quan-ly-the-tin-dung.firebaseapp.com",
      projectId: "quan-ly-the-tin-dung",
      storageBucket: "quan-ly-the-tin-dung.firebasestorage.app",
      messagingSenderId: "217488003582",
      appId: "1:217488003582:web:b340037f8845fe0e2070af"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const cardsCollection = collection(db, "cards");
    const metaDocRef = doc(db, "app_data", "user_notes");
    const categoriesDocRef = doc(db, "app_data", "categories");

    let activeCategories = ["Shopee", "TikTok Shop", "Siêu Thị", "Ăn Uống", "Điện Máy", "Khác"];

    // Lắng nghe danh mục Kênh quẹt
    onSnapshot(categoriesDocRef, (snap) => {
      if (snap.exists() && snap.data().list) {
        activeCategories = snap.data().list;
      } else {
        setDoc(categoriesDocRef, { list: activeCategories });
      }
      renderCategoriesModalList();
    });

    // Lắng nghe Quy tắc & Ghi chú
    onSnapshot(metaDocRef, (snap) => {
      if (snap.exists()) {
        const d = snap.data();
        if (d.rules) document.getElementById("rules-textarea").value = d.rules;
        if (d.notes) document.getElementById("notes-textarea").value = d.notes;
      }
    });

    window.saveRules = async () => {
      const rules = document.getElementById("rules-textarea").value;
      await setDoc(metaDocRef, { rules }, { merge: true });
      alert("Đã lưu Quy tắc thành công!");
    };

    window.saveNotes = async () => {
      const notes = document.getElementById("notes-textarea").value;
      await setDoc(metaDocRef, { notes }, { merge: true });
      alert("Đã lưu Ghi chú thành công!");
    };

    function getCurrentCycleString(offsetMonth = 0) {
      const now = new Date();
      now.setMonth(now.getMonth() + offsetMonth);
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const y = now.getFullYear();
      return `${m}/${y}`;
    }

    // TỰ ĐỘNG CHỐT THÁNG KHI QUA NGÀY SAO KÊ
    async function autoCheckAndCloseBillingCycles(docs) {
      const today = new Date();
      const currentDay = today.getDate();

      for (let docSnap of docs) {
        const data = docSnap.data();
        const id = docSnap.id;
        const statementDay = data.statementDay;
        const currentCycle = data.currentCycle || getCurrentCycleString();
        
        const [mStr, yStr] = currentCycle.split('/');
        const cardCycleMonth = parseInt(mStr);
        const cardCycleYear = parseInt(yStr);

        const realCurrentMonth = today.getMonth() + 1;
        const realCurrentYear = today.getFullYear();

        let shouldAutoClose = false;

        if (cardCycleYear < realCurrentYear || (cardCycleYear === realCurrentYear && cardCycleMonth < realCurrentMonth)) {
          shouldAutoClose = true;
        } else if (cardCycleYear === realCurrentYear && cardCycleMonth === realCurrentMonth && currentDay > statementDay) {
          shouldAutoClose = true;
        }

        if (shouldAutoClose) {
          let nextM = cardCycleMonth + 1;
          let nextY = cardCycleYear;
          if (nextM > 12) { nextM = 1; nextY++; }
          const nextCycleStr = `${String(nextM).padStart(2, '0')}/${nextY}`;

          await addDoc(collection(db, "monthly_archive"), {
            cardName: data.name,
            month: `Tháng ${currentCycle}`,
            cycleMonth: String(cardCycleMonth).padStart(2, '0'),
            cycleYear: cardCycleYear,
            totalSpent: data.currentSpending || 0,
            target: data.target || 0,
            closedAt: new Date().toLocaleString('vi-VN') + " (Tự động chốt sao kê)",
            history: data.history || []
          });

          await updateDoc(doc(db, "cards", id), {
            currentSpending: 0,
            currentCycle: nextCycleStr,
            history: []
          });
        }
      }
    }

    // Lắng nghe dữ liệu Thẻ Realtime
    onSnapshot(cardsCollection, async (snapshot) => {
      if (!snapshot.empty) {
        await autoCheckAndCloseBillingCycles(snapshot.docs);
      }

      const container = document.getElementById("cards-container");
      if (snapshot.empty) {
        container.innerHTML = `<div class="col-span-2 text-center py-12 bg-slate-800/50 rounded-xl border border-slate-700 text-slate-400">Chưa có thẻ nào. Nhấn "+ Thêm Thẻ Mới" để tạo thẻ đầu tiên!</div>`;
        return;
      }

      let cardList = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));

      // SẮP XẾP THỨ TỰ (ĐÃ BỎ CHỨC NĂNG ĐẨY THẺ 100% XUỐNG DƯỚI)
      cardList.sort((a, b) => {
        // 1. Thẻ Ghim ưu tiên xếp lên trên cùng
        if (a.isPinned && !b.isPinned) return -1;
        if (!a.isPinned && b.isPinned) return 1;

        // 2. Các thẻ còn lại xếp theo số ngày sao kê còn ít nhất
        const aDays = getDaysUntilStatement(a.statementDay).daysLeft;
        const bDays = getDaysUntilStatement(b.statementDay).daysLeft;
        return aDays - bDays;
      });

      container.innerHTML = "";
      cardList.forEach(data => {
        const id = data.id;
        const current = Number(data.currentSpending) || 0;
        const target = Number(data.target) || 1;
        const minTarget = Number(data.minTarget) || 0;
        const currentCycle = data.currentCycle || getCurrentCycleString();

        const rawPercent = (current / target) * 100;
        const displayPercent = rawPercent < 0.01 && rawPercent > 0 ? 0.01 : Number(rawPercent.toFixed(2));
        const barWidth = Math.min(rawPercent, 100);

        const theme = getBankThemeCustom(data.name, data.customColor);
        const statementInfo = getDaysUntilStatement(data.statementDay);
        const rewardEstimate = calculateRewardEstimate(data.name, current, target);

        let countdownBadge = statementInfo.isToday 
          ? `<span class="bg-rose-500 text-white font-semibold text-[11px] px-2 py-0.5 rounded-full animate-pulse shadow">Hôm nay sao kê!</span>`
          : statementInfo.daysLeft <= 3
          ? `<span class="bg-amber-500 text-slate-900 font-semibold text-[11px] px-2 py-0.5 rounded-full shadow">Còn ${statementInfo.daysLeft} ngày</span>`
          : `<span class="${theme.badgeBg} text-[11px] px-2 py-0.5 rounded-full border">Còn ${statementInfo.daysLeft} ngày</span>`;

        let minTargetBadge = "";
        if (minTarget > 0) {
          if (current >= minTarget) {
            minTargetBadge = `<span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded border border-emerald-500/30">✔ Đã đạt mốc tối thiểu (${(minTarget/1000000).toFixed(1)}tr)</span>`;
          } else {
            minTargetBadge = `<span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded border border-amber-500/30">⚠️ Cần tiêu thêm ${(minTarget - current).toLocaleString('vi-VN')} đ để đạt mốc hoàn tối thiểu</span>`;
          }
        }

        const categoryOptions = activeCategories.map(cat => `<option value="${cat}">${cat}</option>`).join('');

        container.innerHTML += `
          <div class="${theme.cardBg} rounded-xl shadow-xl border border-white/10 p-5 flex flex-col justify-between transition-all duration-300 min-h-[310px] ${data.isPinned ? 'ring-2 ring-amber-400' : ''}">
            <div>
              <div class="flex justify-between items-start mb-2">
                <div>
                  <div class="flex items-center gap-2">
                    <button onclick="togglePinCard('${id}', ${!data.isPinned})" title="Ghim thẻ lên trên" class="text-sm ${data.isPinned ? 'text-amber-400' : 'text-slate-400 hover:text-white'}">
                      📌
                    </button>
                    <h3 class="font-bold text-base tracking-tight ${theme.headerText}">${data.name}</h3>
                    <span class="text-[10px] ${theme.badgeBg} font-mono px-2 py-0.5 rounded border">Kỳ: ${currentCycle}</span>
                  </div>
                  <div class="flex items-center gap-2 mt-1">
                    <span class="text-xs ${theme.subText}">Sao kê: Ngày ${data.statementDay === 31 ? 'cuối tháng' : data.statementDay}</span>
                    ${countdownBadge}
                  </div>
                </div>
                <div class="space-x-1 shrink-0">
                  <button onclick="editCard('${id}', '${data.name}', ${data.target}, ${data.statementDay}, '${data.rewardNote || ''}', '${data.customColor || ''}', ${minTarget})" class="text-xs font-medium ${theme.subText} hover:opacity-100 px-2 py-1 rounded bg-black/10 hover:bg-black/20">Sửa</button>
                  <button onclick="deleteCard('${id}')" class="text-xs font-medium text-rose-400 hover:text-rose-300 px-2 py-1 rounded bg-rose-500/10 hover:bg-rose-500/20">Xóa</button>
                </div>
              </div>

              <!-- Tiến trình chi tiêu -->
              <div class="mt-3">
                <div class="flex justify-between text-xs font-semibold mb-1">
                  <span class="${theme.spendText}">Đã quẹt: <strong class="font-num text-sm">${current.toLocaleString('vi-VN')} đ</strong></span>
                  <span class="font-num text-sm ${displayPercent >= 100 ? 'text-emerald-400 font-bold' : theme.accentText}">${displayPercent}%</span>
                </div>

              </div>
              <div class="flex justify-between items-center gap-2 pt-1">
                <div class="flex gap-1">

                  <button onclick="closeMonthManual('${id}', '${data.name}', ${current}, ${target}, '${currentCycle}')" class="text-xs text-amber-300 hover:text-amber-200 bg-amber-500/20 hover:bg-amber-500/30 px-2.5 py-1.5 rounded-lg border border-amber-500/30">🔒 Chốt tháng</button>
                </div>
                <button onclick="addSpending('${id}', ${current})" class="${theme.btnBg} text-xs font-medium px-3.5 py-1.5 rounded-lg shrink-0 shadow transition-colors">Cập nhật</button>

    window.togglePinCard = async (id, isPinned) => {
      await updateDoc(doc(db, "cards", id), { isPinned });
    };

    window.addSpending = async (id, currentVal) => {
      const input = document.getElementById(`spend-input-${id}`);
      const catInput = document.getElementById(`spend-cat-${id}`);
      const noteInput = document.getElementById(`spend-note-${id}`);
      const val = Number(input.value);
      const category = catInput.value;
      const extraNote = noteInput.value.trim();
      const fullNote = extraNote ? `[${category}] ${extraNote}` : `[${category}] Quẹt thẻ`;

      if (val) {
        const cardRef = doc(db, "cards", id);
        const cardSnap = await getDoc(cardRef);
        const history = cardSnap.data().history || [];

        const newLog = {
          amount: val,
          category: category,
          note: fullNote,
          timestamp: new Date().toLocaleString('vi-VN')
        };

        await updateDoc(cardRef, {
          currentSpending: currentVal + val,
          history: [newLog, ...history]
        });

        input.value = "";
        noteInput.value = "";
      }
    };

    window.openCategoryModal = () => openModal('modal-categories');

    function renderCategoriesModalList() {
      const container = document.getElementById("category-list");
      if (!container) return;
      container.innerHTML = activeCategories.map((cat, idx) => `
        <div class="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-700 text-xs">
          <span>🛒 ${cat}</span>
          <button onclick="removeCategory(${idx})" class="text-rose-400 hover:text-rose-300">Xóa</button>
        </div>
      `).join('');
    }

    window.addCategory = async () => {
      const input = document.getElementById("new-cat-input");
      const name = input.value.trim();
      if (name && !activeCategories.includes(name)) {
        activeCategories.push(name);
        await setDoc(categoriesDocRef, { list: activeCategories });
        input.value = "";
      }
    };

    window.removeCategory = async (idx) => {
      if (confirm("Xóa danh mục sàn quẹt này?")) {
        activeCategories.splice(idx, 1);
        await setDoc(categoriesDocRef, { list: activeCategories });
      }
    };

    window.openStatsModal = async () => {
      const snapshot = await getDocs(collection(db, "monthly_archive"));
      const container = document.getElementById("stats-content");

      if (snapshot.empty) {
        container.innerHTML = `<p class="text-center text-slate-400 py-6">Chưa có dữ liệu chốt sổ các tháng để thống kê.</p>`;
        openModal('modal-stats');
        return;
      }

      const records = snapshot.docs.map(d => d.data());
      
      const yearTotalStats = {};
      const cardYearStats = {};
      const monthCategoryStats = {};

      records.forEach(r => {
        const year = r.cycleYear || 'Khác';
        const cardName = r.cardName || 'Thẻ không tên';
        const spent = r.totalSpent || 0;
        const monthKey = r.month || 'Khác';

        yearTotalStats[year] = (yearTotalStats[year] || 0) + spent;

        if (!cardYearStats[year]) cardYearStats[year] = {};
        cardYearStats[year][cardName] = (cardYearStats[year][cardName] || 0) + spent;

        if (r.history && Array.isArray(r.history)) {
          if (!monthCategoryStats[monthKey]) monthCategoryStats[monthKey] = {};
          r.history.forEach(item => {
            const cat = item.category || 'Khác';
            monthCategoryStats[monthKey][cat] = (monthCategoryStats[monthKey][cat] || 0) + (item.amount || 0);
          });
        }
      });

      let html = `<div class="space-y-4">`;

      for (const [yr, cardMap] of Object.entries(cardYearStats)) {
        html += `
          <div class="bg-slate-900 border border-slate-700/80 p-3.5 rounded-lg space-y-2">
            <div class="flex justify-between items-center border-b border-slate-800 pb-1.5">
              <h3 class="font-bold text-amber-400 text-sm">📅 Tổng Chi Tiêu Năm ${yr}</h3>
              <span class="font-bold font-num text-emerald-400 text-sm">${yearTotalStats[yr].toLocaleString('vi-VN')} đ</span>
            </div>
            <div class="space-y-1 pt-1">
              <p class="text-[11px] text-slate-400 font-semibold mb-1">Chi tiết từng loại thẻ:</p>
        `;
        for (const [cName, total] of Object.entries(cardMap)) {
          html += `<div class="flex justify-between text-xs py-0.5"><span class="text-slate-300">💳 ${cName}:</span> <span class="font-bold font-num text-indigo-300">${total.toLocaleString('vi-VN')} đ</span></div>`;
        }
        html += `</div></div>`;
      }

      html += `
        <div class="bg-slate-900 border border-slate-700/80 p-3.5 rounded-lg space-y-2">
          <h3 class="font-bold text-indigo-400 text-sm">🛒 Thống Kê Theo Kênh / Sàn Quẹt Các Tháng</h3>
          <div class="space-y-3 pt-1">
      `;
      for (const [mKey, catMap] of Object.entries(monthCategoryStats)) {
        html += `<div class="border-b border-slate-800/80 pb-2"><p class="font-bold text-slate-200 text-xs mb-1">${mKey}:</p>`;
        for (const [catName, catTotal] of Object.entries(catMap)) {
          html += `<div class="flex justify-between text-[11px] pl-2 text-slate-400"><span>• ${catName}:</span> <span class="font-num text-slate-200">${catTotal.toLocaleString('vi-VN')} đ</span></div>`;
        }
        html += `</div>`;
      }
      html += `</div></div></div>`;

      container.innerHTML = html;
      openModal('modal-stats');
    };

    document.getElementById("card-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("card-id").value.trim();
      const name = document.getElementById("card-name").value.trim();
      const target = Number(document.getElementById("card-target").value);
      const minTarget = Number(document.getElementById("card-min-target").value) || 0;
      const statementDay = Number(document.getElementById("card-statement").value);
      const customColor = document.getElementById("card-color").value;
      const rewardNote = document.getElementById("card-reward").value.trim();

      if (id !== "") {
        await updateDoc(doc(db, "cards", id), { name, target, minTarget, statementDay, customColor, rewardNote });
      } else {
        await addDoc(cardsCollection, { 
          name, 
          target, 
          minTarget,
          statementDay, 
          customColor,
          rewardNote, 
          currentSpending: 0, 
          currentCycle: getCurrentCycleString(),
          isPinned: false,
          history: [] 
        });
      }

      closeModal('modal-add');
    });

    window.closeMonthManual = async (id, name, current, target, currentCycle) => {
      const confirmMsg = `Thủ công chốt sổ thẻ ${name} cho kỳ [${currentCycle}] với tổng chi: ${current.toLocaleString('vi-VN')} đ?\nThẻ sẽ tự động nhảy sang chu kỳ tháng tiếp theo!`;
      if (!confirm(confirmMsg)) return;

      const [mStr, yStr] = currentCycle.split('/');
      let m = parseInt(mStr);
      let y = parseInt(yStr);
      m++;
      if (m > 12) { m = 1; y++; }
      const nextCycle = `${String(m).padStart(2, '0')}/${y}`;

      const cardSnap = await getDoc(doc(db, "cards", id));
      const history = cardSnap.data().history || [];

      await addDoc(collection(db, "monthly_archive"), {
        cardName: name,
        month: `Tháng ${currentCycle}`,
        cycleMonth: mStr,
        cycleYear: parseInt(yStr),
        totalSpent: current,
        target: target,
        closedAt: new Date().toLocaleString('vi-VN'),
        history: history
      });

      await updateDoc(doc(db, "cards", id), {
        currentSpending: 0,
        currentCycle: nextCycle,
        history: []
      });

      alert(`Đã chốt sổ kỳ ${currentCycle}! Kỳ tiếp theo của thẻ ${name} hiện tại là: ${nextCycle}`);
    };

    window.exportBackupData = async () => {
      const cardsSnap = await getDocs(cardsCollection);
      const cardsData = cardsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      const monthlySnap = await getDocs(collection(db, "monthly_archive"));
      const monthlyData = monthlySnap.docs.map(d => ({ id: d.id, ...d.data() }));

      const backupObj = {
        exportDate: new Date().toISOString(),
        cards: cardsData,
        monthlyArchive: monthlyData
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObj, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `Backup_QuanLyThe_${getCurrentCycleString().replace('/','-')}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

      document.getElementById("history-modal-title").innerText = `Lịch Sử Giao Dịch: ${cardName}`;
      const cardSnap = await getDoc(doc(db, "cards", id));

        container.innerHTML = `<p class="text-center text-slate-400 py-6 text-xs">Chưa có giao dịch nào được ghi nhận.</p>`;
      } else {

    window.deleteHistoryItem = async (cardId, index) => {
      if (confirm("Xóa giao dịch này và trừ tiền tương ứng?")) {
        const cardRef = doc(db, "cards", cardId);
        const cardSnap = await getDoc(cardRef);
        const data = cardSnap.data();
        const history = data.history || [];
        const deletedItem = history[index];

        history.splice(index, 1);
        const newSpending = Math.max(0, (data.currentSpending || 0) - deletedItem.amount);

        await updateDoc(cardRef, {
          currentSpending: newSpending,
          history: history
        });
        viewHistory(cardId, data.name);
      }
    };

    window.openMonthlyHistory = () => {

      });
    };

    function calculateRewardEstimate(cardName, current, target) {
      const name = cardName.toUpperCase();
      const percent = (current / target) * 100;
      if (name.includes('SUPER CARD')) {
        const points = Math.min(Math.floor((current / target) * 500000), 500000);
        return `${points.toLocaleString('vi-VN')} / 500.000 điểm`;
      }
      if (percent >= 100) return "🎉 Đã ĐẠT MỐC Hoàn Thưởng!";
      return `Đạt ${percent.toFixed(1)}% mốc thưởng`;
    }

    function getDaysUntilStatement(statementDayInput) {
      const today = new Date();
      const currentYear = today.getFullYear();
      const currentMonth = today.getMonth();
      const todayDate = today.getDate();

      const lastDayOfCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      let actualStatementDay = Math.min(statementDayInput, lastDayOfCurrentMonth);
      let targetDate = new Date(currentYear, currentMonth, actualStatementDay);

      if (todayDate > actualStatementDay) {
        const lastDayOfNextMonth = new Date(currentYear, currentMonth + 2, 0).getDate();
        const nextStatementDay = Math.min(statementDayInput, lastDayOfNextMonth);
        targetDate = new Date(currentYear, currentMonth + 1, nextStatementDay);
      }

      const diffTime = targetDate.getTime() - new Date(currentYear, currentMonth, todayDate).getTime();
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return { daysLeft: diffDays, isToday: diffDays === 0 };
    }
