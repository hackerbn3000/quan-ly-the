<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Thẻ Tín Dụng</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto">
    <header class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">Thống Kê Thẻ Tín Dụng</h1>
        <p class="text-sm text-slate-500">Quản lý mốc chi tiêu & đếm ngược ngày chốt sao kê</p>
      </div>
      <button onclick="toggleModal('modal-add')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm shadow transition-colors">
        + Thêm Thẻ Mới
      </button>
    </header>

    <!-- Danh sách thẻ -->
    <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <p class="text-slate-500 text-center col-span-2 py-8">Đang tải dữ liệu thẻ...</p>
    </div>
  </div>

  <!-- Modal Thêm/Sửa Thẻ -->
  <div id="modal-add" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-6 max-w-md w-full shadow-xl">
      <h2 id="modal-title" class="text-lg font-bold text-slate-800 mb-4">Thêm Thẻ Tín Dụng</h2>
      <form id="card-form" class="space-y-4">
        <input type="hidden" id="card-id">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tên Thẻ / Ngân Hàng (VD: TPBank, VPBank, VIB)</label>
          <input type="text" id="card-name" placeholder="VD: VIB Super Card" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Mốc Chi Tiêu (VNĐ)</label>
            <input type="number" id="card-target" placeholder="10000000" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Ngày Sao Kê (Gõ 31 nếu cuối tháng)</label>
            <input type="number" id="card-statement" min="1" max="31" placeholder="20" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Ghi Chú Hoàn Thưởng</label>
          <input type="text" id="card-reward" placeholder="VD: Hoàn Max Cap 500k điểm, trả hàng tuần" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="toggleModal('modal-add')" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Hủy</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Lưu Thẻ</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // THAY CẤU HÌNH FIREBASE CỦA BẠN VÀO ĐÂY
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const cardsCollection = collection(db, "cards");

    // Hàm xác định màu thẻ dựa trên tên ngân hàng
    function getBankTheme(cardName = '') {
      const name = cardName.toUpperCase();
      if (name.includes('TP') || name.includes('TPBANK')) {
        return {
          cardBg: 'bg-purple-900',
          headerText: 'text-purple-100',
          subText: 'text-purple-200',
          badgeBg: 'bg-purple-800/60 text-purple-200 border-purple-700',
          progressBg: 'bg-purple-950/50',
          progressBar: 'bg-amber-400',
          spendText: 'text-purple-200',
          rewardBg: 'bg-purple-950/40 text-purple-200 border-purple-700/50',
          btnBg: 'bg-amber-500 hover:bg-amber-600 text-slate-900',
          inputBg: 'bg-purple-950/60 text-white placeholder-purple-300 border-purple-700 focus:ring-amber-400',
          accentText: 'text-amber-300'
        };
      }
      if (name.includes('VP') || name.includes('VPBANK')) {
        return {
          cardBg: 'bg-emerald-900',
          headerText: 'text-emerald-100',
          subText: 'text-emerald-200',
          badgeBg: 'bg-emerald-800/60 text-emerald-200 border-emerald-700',
          progressBg: 'bg-emerald-950/50',
          progressBar: 'bg-emerald-400',
          spendText: 'text-emerald-200',
          rewardBg: 'bg-emerald-950/40 text-emerald-200 border-emerald-700/50',
          btnBg: 'bg-emerald-500 hover:bg-emerald-600 text-white',
          inputBg: 'bg-emerald-950/60 text-white placeholder-emerald-300 border-emerald-700 focus:ring-emerald-400',
          accentText: 'text-emerald-300'
        };
      }
      if (name.includes('VIB')) {
        return {
          cardBg: 'bg-blue-900',
          headerText: 'text-blue-100',
          subText: 'text-blue-200',
          badgeBg: 'bg-blue-800/60 text-blue-200 border-blue-700',
          progressBg: 'bg-blue-950/50',
          progressBar: 'bg-orange-400',
          spendText: 'text-blue-200',
          rewardBg: 'bg-blue-950/40 text-blue-200 border-blue-700/50',
          btnBg: 'bg-orange-500 hover:bg-orange-600 text-white',
          inputBg: 'bg-blue-950/60 text-white placeholder-blue-300 border-blue-700 focus:ring-orange-400',
          accentText: 'text-orange-300'
        };
      }
      // Màu mặc định nếu là ngân hàng khác
      return {
        cardBg: 'bg-slate-800',
        headerText: 'text-slate-100',
        subText: 'text-slate-300',
        badgeBg: 'bg-slate-700/60 text-slate-200 border-slate-600',
        progressBg: 'bg-slate-900/50',
        progressBar: 'bg-indigo-400',
        spendText: 'text-slate-300',
        rewardBg: 'bg-slate-900/40 text-slate-200 border-slate-700',
        btnBg: 'bg-indigo-500 hover:bg-indigo-600 text-white',
        inputBg: 'bg-slate-900/60 text-white placeholder-slate-400 border-slate-700 focus:ring-indigo-400',
        accentText: 'text-indigo-300'
      };
    }

    // Hàm tính đếm ngược ngày sao kê
    function getDaysUntilStatement(statementDayInput) {
      const today = new Date();
      const currentYear = today.getFullYear();
      const currentMonth = today.getMonth(); // 0-indexed
      const todayDate = today.getDate();

      // Xác định ngày cuối tháng của tháng hiện tại
      const lastDayOfCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      let actualStatementDay = Math.min(statementDayInput, lastDayOfCurrentMonth);

      let targetDate = new Date(currentYear, currentMonth, actualStatementDay);

      // Nếu ngày sao kê tháng này đã qua, tính ngày sao kê của tháng sau
      if (todayDate > actualStatementDay) {
        const lastDayOfNextMonth = new Date(currentYear, currentMonth + 2, 0).getDate();
        const nextStatementDay = Math.min(statementDayInput, lastDayOfNextMonth);
        targetDate = new Date(currentYear, currentMonth + 1, nextStatementDay);
      }

      // Tính số ngày chênh lệch
      const diffTime = targetDate.getTime() - new Date(currentYear, currentMonth, todayDate).getTime();
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      return {
        daysLeft: diffDays,
        isToday: diffDays === 0
      };
    }

    // Tải danh sách thẻ realtime
    onSnapshot(cardsCollection, (snapshot) => {
      const container = document.getElementById("cards-container");
      if (snapshot.empty) {
        container.innerHTML = `<div class="col-span-2 text-center py-12 bg-white rounded-xl shadow-sm border text-slate-500">Chưa có thẻ nào. Nhấn "+ Thêm Thẻ Mới" để tạo thẻ đầu tiên!</div>`;
        return;
      }
      container.innerHTML = "";
      snapshot.docs.forEach(docSnap => {
        const data = docSnap.data();
        const id = docSnap.id;
        const current = data.currentSpending || 0;
        const target = data.target || 1;
        const percent = Math.min(Math.round((current / target) * 100), 100);

        const theme = getBankTheme(data.name);
        const statementInfo = getDaysUntilStatement(data.statementDay);

        // Tạo badge đếm ngược ngày sao kê
        let countdownBadge = '';
        if (statementInfo.isToday) {
          countdownBadge = `<span class="bg-rose-500 text-white font-semibold text-xs px-2.5 py-1 rounded-full animate-pulse shadow">Hôm nay chốt sao kê!</span>`;
        } else if (statementInfo.daysLeft <= 3) {
          countdownBadge = `<span class="bg-amber-500 text-slate-900 font-semibold text-xs px-2.5 py-1 rounded-full shadow">Còn ${statementInfo.daysLeft} ngày (Gấp)</span>`;
        } else {
          countdownBadge = `<span class="${theme.badgeBg} text-xs px-2.5 py-1 rounded-full border">Còn ${statementInfo.daysLeft} ngày</span>`;
        }

        container.innerHTML += `
          <div class="${theme.cardBg} rounded-xl shadow-lg border border-white/10 p-5 flex flex-col justify-between transition-all duration-300">
            <div>
              <div class="flex justify-between items-start mb-3">
                <div>
                  <h3 class="font-bold text-lg ${theme.headerText}">${data.name}</h3>
                  <div class="flex items-center gap-2 mt-1">
                    <span class="text-xs ${theme.subText}">Sao kê ngày ${data.statementDay === 31 ? 'cuối tháng' : data.statementDay}</span>
                    ${countdownBadge}
                  </div>
                </div>
                <div class="space-x-1 shrink-0">
                  <button onclick="editCard('${id}', '${data.name}', ${data.target}, ${data.statementDay}, '${data.rewardNote || ''}')" class="text-xs text-white/70 hover:text-white px-2 py-1 rounded hover:bg-white/10">Sửa</button>
                  <button onclick="deleteCard('${id}')" class="text-xs text-rose-300 hover:text-rose-100 px-2 py-1 rounded hover:bg-rose-500/20">Xóa</button>
                </div>
              </div>

              <!-- Tiến trình chi tiêu -->
              <div class="mt-4">
                <div class="flex justify-between text-xs font-semibold mb-1">
                  <span class="${theme.spendText}">Đã quẹt: ${Number(current).toLocaleString('vi-VN')} đ</span>
                  <span class="${percent >= 100 ? 'text-emerald-400 font-bold' : theme.accentText}">${percent}%</span>
                </div>
                <div class="w-full ${theme.progressBg} rounded-full h-3 p-0.5 border border-white/10">
                  <div class="${percent >= 100 ? 'bg-emerald-400' : theme.progressBar} h-2 rounded-full transition-all duration-500" style="width: ${percent}%"></div>
                </div>
                <p class="text-xs ${theme.subText} mt-1 text-right">Mốc: ${Number(target).toLocaleString('vi-VN')} đ</p>
              </div>

              ${data.rewardNote ? `<div class="mt-3 p-2.5 ${theme.rewardBg} rounded-lg text-xs border backdrop-blur-sm">💡 ${data.rewardNote}</div>` : ''}
            </div>

            <!-- Cập nhật chi tiêu -->
            <div class="mt-5 pt-4 border-t border-white/10 flex gap-2">
              <input type="number" id="spend-input-${id}" placeholder="+ Thêm tiền quẹt" class="${theme.inputBg} rounded-lg p-2 text-xs w-full outline-none border focus:ring-1">
              <button onclick="addSpending('${id}', ${current})" class="${theme.btnBg} text-xs font-medium px-3 py-2 rounded-lg shrink-0 shadow transition-colors">Cập nhật</button>
              <button onclick="resetSpending('${id}')" class="text-xs text-white/50 hover:text-white shrink-0 px-1">Reset</button>
            </div>
          </div>
        `;
      });
    });

    // Thêm/Sửa Thẻ
    document.getElementById("card-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("card-id").value;
      const name = document.getElementById("card-name").value;
      const target = Number(document.getElementById("card-target").value);
      const statementDay = Number(document.getElementById("card-statement").value);
      const rewardNote = document.getElementById("card-reward").value;

      if (id) {
        await updateDoc(doc(db, "cards", id), { name, target, statementDay, rewardNote });
      } else {
        await addDoc(cardsCollection, { name, target, statementDay, rewardNote, currentSpending: 0 });
      }
      toggleModal('modal-add');
      document.getElementById("card-form").reset();
    });

    // Các hàm thao tác dữ liệu
    window.addSpending = async (id, currentVal) => {
      const input = document.getElementById(`spend-input-${id}`);
      const val = Number(input.value);
      if (val) {
        await updateDoc(doc(db, "cards", id), { currentSpending: currentVal + val });
        input.value = "";
      }
    };

    window.resetSpending = async (id) => {
      if (confirm("Reset chi tiêu thẻ này về 0 đ?")) {
        await updateDoc(doc(db, "cards", id), { currentSpending: 0 });
      }
    };

    window.deleteCard = async (id) => {
      if (confirm("Bạn có chắc chắn muốn xóa thẻ này?")) {
        await deleteDoc(doc(db, "cards", id));
      }
    };

    window.editCard = (id, name, target, statementDay, rewardNote) => {
      document.getElementById("card-id").value = id;
      document.getElementById("card-name").value = name;
      document.getElementById("card-target").value = target;
      document.getElementById("card-statement").value = statementDay;
      document.getElementById("card-reward").value = rewardNote;
      document.getElementById("modal-title").innerText = "Chỉnh Sửa Thẻ";
      toggleModal('modal-add');
    };

    window.toggleModal = (modalId) => {
      const el = document.getElementById(modalId);
      el.classList.toggle("hidden");
      if (el.classList.contains("hidden")) {
        document.getElementById("card-form").reset();
        document.getElementById("card-id").value = "";
        document.getElementById("modal-title").innerText = "Thêm Thẻ Tín Dụng";
      }
    };
  </script>
</body>
</html>
