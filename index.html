<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Thẻ Tín Dụng Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Cấu hình PWA -->
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quản Lý Thẻ">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlF14bqStoredIExZw7AgVGjhurogVMOtbiBE4bulbmciLAogICJzaG9ydF9uYW1lIjogIlF14bqStoredIExZw7AgVGjhurIiLAogICJzdGFydF91cmwiOiAiLi8iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwZjE3MmEiLAogICJ0aGVtZV9jb2xvciI6ICIjMGYxNzJhIgp9">
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6 pb-20">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b border-slate-800">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          💳 Quản Lý Thẻ Tín Dụng Pro
        </h1>
        <p class="text-xs text-slate-400 mt-1">Theo dõi chi tiêu, đếm ngược sao kê & tích thưởng chuyên nghiệp</p>
      </div>
      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <button onclick="openStatsModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-3 py-2 rounded-lg text-xs border border-slate-700">
          📊 Thống Kê
        </button>
        <button onclick="openMonthlyHistory()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-3 py-2 rounded-lg text-xs border border-slate-700">
          📜 Lịch Sử Tháng
        </button>
        <button onclick="exportBackupData()" class="bg-emerald-700 hover:bg-emerald-600 text-white font-medium px-3 py-2 rounded-lg text-xs shadow">
          📥 Xuất Backup
        </button>
        <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg text-xs shadow">
          + Thêm Thẻ Mới
        </button>
      </div>
    </header>

    <!-- Bố cục: Danh Sách Thẻ (Bên Trái - 3 phần) | Quy Tắc & Ghi Chú (Bên Phải - 1 phần) -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
      
      <!-- Cột Trái: Danh sách Thẻ Tín Dụng (Luôn hiển thị 2 thẻ/hàng) -->
      <div class="lg:col-span-3">
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <p class="text-slate-400 text-center col-span-2 py-8">Đang tải dữ liệu thẻ từ Firebase...</p>
        </div>
      </div>

      <!-- Cột Phải: Gom Quy Tắc & Ghi Chú vào cùng một bên -->
      <div class="lg:col-span-1 space-y-5">
        
        <!-- Mục Quy Tắc -->
        <div class="bg-slate-800/60 rounded-xl p-4 border border-slate-700/60">
          <h2 class="text-sm font-bold text-indigo-400 mb-2 flex items-center justify-between">
            <span>📌 Quy Tắc Dùng Thẻ</span>
            <button onclick="saveRules()" class="text-[10px] bg-indigo-600/30 text-indigo-300 px-2 py-0.5 rounded border border-indigo-500/30 hover:bg-indigo-600/50">Lưu</button>
          </h2>
          <textarea id="rules-textarea" rows="7" placeholder="- Thẻ VIB: Quẹt Ẩm thực/Khách sạn...&#10;- Thẻ VPBank: Tiêu mốc 3.3tr max xu...&#10;- Kiểm tra MCC trước khi thanh toán." class="w-full bg-slate-900 border border-slate-700/80 rounded-lg p-2 text-xs text-slate-200 outline-none focus:border-indigo-500 resize-none leading-relaxed"></textarea>
        </div>

        <!-- Mục Ghi Chú Nhanh -->
        <div class="bg-slate-800/60 rounded-xl p-4 border border-slate-700/60">
          <h2 class="text-sm font-bold text-amber-400 mb-2 flex items-center justify-between">
            <span>📝 Ghi Chú Nhanh</span>
            <button onclick="saveNotes()" class="text-[10px] bg-amber-600/30 text-amber-300 px-2 py-0.5 rounded border border-amber-500/30 hover:bg-amber-600/50">Lưu</button>
          </h2>
          <textarea id="notes-textarea" rows="7" placeholder="- Cần thanh toán trả góp ngày 15...&#10;- Kiểm tra cashback TPBank...&#10;- Mã giảm giá mua sắm..." class="w-full bg-slate-900 border border-slate-700/80 rounded-lg p-2 text-xs text-slate-200 outline-none focus:border-amber-500 resize-none leading-relaxed"></textarea>
        </div>

      </div>

    </div>
  </div>

  <!-- Modal Thêm/Sửa Thẻ (Có màu Đen VIP) -->
  <div id="modal-add" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-slate-800 rounded-xl p-6 max-w-md w-full shadow-2xl border border-slate-700 text-slate-100">
      <h2 id="modal-title" class="text-lg font-bold mb-4">Thêm Thẻ Tín Dụng</h2>
      <form id="card-form" class="space-y-4">
        <input type="hidden" id="card-id" value="">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Tên Thẻ / Ngân Hàng</label>
          <input type="text" id="card-name" placeholder="VD: VIB Super Card" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Mốc Chi Tiêu (VNĐ)</label>
            <input type="number" id="card-target" placeholder="10000000" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Ngày Sao Kê (1-31)</label>
            <input type="number" id="card-statement" min="1" max="31" placeholder="20" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Tông Màu Thẻ</label>
          <select id="card-color" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="black">🖤 Đen VIP (Black Platinum / Metal)</option>
            <option value="blue">💙 Xanh Dương (VIB / Techcombank)</option>
            <option value="purple">💜 Tím (TPBank / VPBank EVO)</option>
            <option value="emerald">💚 Xanh Lá (VPBank / Sacombank)</option>
            <option value="rose">❤️ Đỏ Rose (HSBC / MB)</option>
            <option value="amber">💛 Vàng Hoàng Gia (VPBank Diamond)</option>
            <option value="slate">🩶 Xám Neutral (Mặc định)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Ghi Chú Hoàn Thưởng</label>
          <input type="text" id="card-reward" placeholder="VD: Hoàn Max Cap 500k điểm, trả hàng tuần" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('modal-add')" class="px-4 py-2 text-sm text-slate-400 hover:bg-slate-700 rounded-lg">Hủy</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-500">Lưu Thẻ</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Xem Thống Kê Hàng Tháng - Hàng Năm -->
  <div id="modal-stats" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-slate-800 rounded-xl p-6 max-w-xl w-full shadow-2xl border border-slate-700 text-slate-100 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
        <h2 class="text-lg font-bold">📊 Thống Kê Chi Tiêu Tổng Hợp</h2>
        <button onclick="closeModal('modal-stats')" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
      </div>
      <div id="stats-content" class="space-y-4 overflow-y-auto pr-1 flex-1 text-xs"></div>
    </div>
  </div>

  <!-- Modal Lịch Sử Giao Dịch Chi Tiết -->
  <div id="modal-history" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-slate-800 rounded-xl p-6 max-w-lg w-full shadow-2xl border border-slate-700 text-slate-100 max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
        <h2 id="history-modal-title" class="text-lg font-bold">Lịch Sử Giao Dịch</h2>
        <button onclick="closeModal('modal-history')" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
      </div>
      <div id="history-list" class="space-y-2 overflow-y-auto pr-1 flex-1"></div>
    </div>
  </div>

  <!-- Modal Lịch Sử Tháng -->
  <div id="modal-monthly" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-slate-800 rounded-xl p-6 max-w-lg w-full shadow-2xl border border-slate-700 text-slate-100 max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
        <h2 class="text-lg font-bold">📜 Lịch Sử Chốt Sổ Các Tháng</h2>
        <button onclick="closeModal('modal-monthly')" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
      </div>
      <div id="monthly-history-list" class="space-y-3 overflow-y-auto pr-1 flex-1"></div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, getDoc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // CẤU HÌNH FIREBASE THỰC TẾ CỦA BẠN
    const firebaseConfig = {
      apiKey: "AIzaSyCmtLvK0_CZ7EA_zbUjs01lqxN6ifO87Ok",
      authDomain: "quan-ly-the-tin-dung.firebaseapp.com",
      projectId: "quan-ly-the-tin-dung",
      storageBucket: "quan-ly-the-tin-dung.firebasestorage.app",
      messagingSenderId: "217488003582",
      appId: "1:217488003582:web:b340037f8845fe0e2070af"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const cardsCollection = collection(db, "cards");
    const metaDocRef = doc(db, "app_data", "user_notes");

    // Lắng nghe Quy tắc & Ghi chú cá nhân
    onSnapshot(metaDocRef, (snap) => {
      if (snap.exists()) {
        const d = snap.data();
        if (d.rules) document.getElementById("rules-textarea").value = d.rules;
        if (d.notes) document.getElementById("notes-textarea").value = d.notes;
      }
    });

    window.saveRules = async () => {
      const rules = document.getElementById("rules-textarea").value;
      await setDoc(metaDocRef, { rules }, { merge: true });
      alert("Đã lưu Quy tắc thành công!");
    };

    window.saveNotes = async () => {
      const notes = document.getElementById("notes-textarea").value;
      await setDoc(metaDocRef, { notes }, { merge: true });
      alert("Đã lưu Ghi chú thành công!");
    };

    function getCurrentCycleString(offsetMonth = 0) {
      const now = new Date();
      now.setMonth(now.getMonth() + offsetMonth);
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const y = now.getFullYear();
      return `${m}/${y}`;
    }

    // Lắng nghe dữ liệu Thẻ Realtime
    onSnapshot(cardsCollection, (snapshot) => {
      const container = document.getElementById("cards-container");
      if (snapshot.empty) {
        container.innerHTML = `<div class="col-span-2 text-center py-12 bg-slate-800/50 rounded-xl border border-slate-700 text-slate-400">Chưa có thẻ nào. Nhấn "+ Thêm Thẻ Mới" để tạo thẻ đầu tiên!</div>`;
        return;
      }
      container.innerHTML = "";
      snapshot.docs.forEach(docSnap => {
        const data = docSnap.data();
        const id = docSnap.id;
        const current = Number(data.currentSpending) || 0;
        const target = Number(data.target) || 1;
        const currentCycle = data.currentCycle || getCurrentCycleString();

        const rawPercent = (current / target) * 100;
        const displayPercent = rawPercent < 0.01 && rawPercent > 0 ? 0.01 : Number(rawPercent.toFixed(2));
        const barWidth = Math.min(rawPercent, 100);

        const theme = getBankThemeCustom(data.name, data.customColor);
        const statementInfo = getDaysUntilStatement(data.statementDay);
        const rewardEstimate = calculateRewardEstimate(data.name, current, target);

        let countdownBadge = statementInfo.isToday 
          ? `<span class="bg-rose-500 text-white font-semibold text-xs px-2 py-0.5 rounded-full animate-pulse shadow">Hôm nay sao kê!</span>`
          : statementInfo.daysLeft <= 3
          ? `<span class="bg-amber-500 text-slate-900 font-semibold text-xs px-2 py-0.5 rounded-full shadow">Còn ${statementInfo.daysLeft} ngày</span>`
          : `<span class="${theme.badgeBg} text-xs px-2 py-0.5 rounded-full border">Còn ${statementInfo.daysLeft} ngày</span>`;

        container.innerHTML += `
          <div class="${theme.cardBg} rounded-xl shadow-xl border border-white/10 p-4 sm:p-5 flex flex-col justify-between transition-all duration-300">
            <div>
              <div class="flex justify-between items-start mb-3">
                <div>
                  <div class="flex items-center gap-2">
                    <h3 class="font-bold text-lg ${theme.headerText}">${data.name}</h3>
                    <span class="text-[10px] bg-white/10 text-slate-300 px-2 py-0.5 rounded border border-white/10">Kỳ: ${currentCycle}</span>
                  </div>
                  <div class="flex items-center gap-2 mt-1">
                    <span class="text-xs ${theme.subText}">Sao kê: Ngày ${data.statementDay === 31 ? 'cuối tháng' : data.statementDay}</span>
                    ${countdownBadge}
                  </div>
                </div>
                <div class="space-x-1 shrink-0">
                  <button onclick="editCard('${id}', '${data.name}', ${data.target}, ${data.statementDay}, '${data.rewardNote || ''}', '${data.customColor || ''}')" class="text-xs text-white/70 hover:text-white px-2 py-1 rounded hover:bg-white/10">Sửa</button>
                  <button onclick="deleteCard('${id}')" class="text-xs text-rose-300 hover:text-rose-100 px-2 py-1 rounded hover:bg-rose-500/20">Xóa</button>
                </div>
              </div>

              <!-- Tiến trình -->
              <div class="mt-3">
                <div class="flex justify-between text-xs font-semibold mb-1">
                  <span class="${theme.spendText}">Đã quẹt: ${current.toLocaleString('vi-VN')} đ</span>
                  <span class="${displayPercent >= 100 ? 'text-emerald-400 font-bold' : theme.accentText}">${displayPercent}%</span>
                </div>
                <div class="w-full ${theme.progressBg} rounded-full h-3 p-0.5 border border-white/10">
                  <div class="${displayPercent >= 100 ? 'bg-emerald-400' : theme.progressBar} h-2 rounded-full transition-all duration-500" style="width: ${barWidth}%"></div>
                </div>
                <p class="text-xs ${theme.subText} mt-1 text-right">Mốc: ${target.toLocaleString('vi-VN')} đ</p>
              </div>

              <!-- Thưởng & Ghi chú -->
              <div class="mt-3 space-y-2">
                <div class="p-2.5 ${theme.rewardBg} rounded-lg text-xs border backdrop-blur-sm flex justify-between items-center">
                  <span>🎯 Hoàn thưởng:</span>
                  <span class="font-bold ${theme.accentText}">${rewardEstimate}</span>
                </div>
                ${data.rewardNote ? `<div class="p-2 bg-black/20 rounded text-xs text-white/80 italic">💡 ${data.rewardNote}</div>` : ''}
              </div>
            </div>

            <!-- Cập nhật chi tiêu & Chốt tháng -->
            <div class="mt-4 pt-3 border-t border-white/10 space-y-2">
              <div class="flex gap-2">
                <input type="number" id="spend-input-${id}" placeholder="+ Tiền quẹt" class="${theme.inputBg} rounded-lg p-2 text-xs w-2/3 outline-none border focus:ring-1">
                <input type="text" id="spend-note-${id}" placeholder="Ghi chú" class="${theme.inputBg} rounded-lg p-2 text-xs w-1/3 outline-none border focus:ring-1">
              </div>
              <div class="flex justify-between items-center gap-2 pt-1">
                <div class="flex gap-1">
                  <button onclick="viewHistory('${id}', '${data.name}')" class="text-xs text-white/80 hover:text-white bg-white/10 hover:bg-white/20 px-2.5 py-1.5 rounded-lg border border-white/10">📜 Lịch sử</button>
                  <button onclick="closeMonthAuto('${id}', '${data.name}', ${current}, ${target}, '${currentCycle}')" class="text-xs text-amber-300 hover:text-amber-200 bg-amber-500/20 hover:bg-amber-500/30 px-2.5 py-1.5 rounded-lg border border-amber-500/30">🔒 Chốt tháng</button>
                </div>
                <button onclick="addSpending('${id}', ${current})" class="${theme.btnBg} text-xs font-medium px-3.5 py-1.5 rounded-lg shrink-0 shadow transition-colors">Cập nhật</button>
              </div>
            </div>
          </div>
        `;
      });
    });

    // Thêm/Sửa Thẻ
    document.getElementById("card-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("card-id").value.trim();
      const name = document.getElementById("card-name").value.trim();
      const target = Number(document.getElementById("card-target").value);
      const statementDay = Number(document.getElementById("card-statement").value);
      const customColor = document.getElementById("card-color").value;
      const rewardNote = document.getElementById("card-reward").value.trim();

      if (id !== "") {
        await updateDoc(doc(db, "cards", id), { name, target, statementDay, customColor, rewardNote });
      } else {
        await addDoc(cardsCollection, { 
          name, 
          target, 
          statementDay, 
          customColor,
          rewardNote, 
          currentSpending: 0, 
          currentCycle: getCurrentCycleString(),
          history: [] 
        });
      }

      closeModal('modal-add');
    });

    // Chốt sổ tự động
    window.closeMonthAuto = async (id, name, current, target, currentCycle) => {
      const confirmMsg = `Xác nhận chốt sổ thẻ ${name} cho chu kỳ [${currentCycle}] với tổng chi: ${current.toLocaleString('vi-VN')} đ?\nThẻ sẽ tự động nhảy sang chu kỳ tháng tiếp theo!`;
      if (!confirm(confirmMsg)) return;

      const [mStr, yStr] = currentCycle.split('/');
      let m = parseInt(mStr);
      let y = parseInt(yStr);
      m++;
      if (m > 12) {
        m = 1;
        y++;
      }
      const nextCycle = `${String(m).padStart(2, '0')}/${y}`;

      await addDoc(collection(db, "monthly_archive"), {
        cardName: name,
        month: `Tháng ${currentCycle}`,
        cycleMonth: mStr,
        cycleYear: y,
        totalSpent: current,
        target: target,
        closedAt: new Date().toLocaleString('vi-VN')
      });

      await updateDoc(doc(db, "cards", id), {
        currentSpending: 0,
        currentCycle: nextCycle,
        history: []
      });

      alert(`Đã chốt sổ kỳ ${currentCycle}! Kỳ tiếp theo của thẻ ${name} hiện tại là: ${nextCycle}`);
    };

    // Xuất file Backup JSON
    window.exportBackupData = async () => {
      const cardsSnap = await getDocs(cardsCollection);
      const cardsData = cardsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      const monthlySnap = await getDocs(collection(db, "monthly_archive"));
      const monthlyData = monthlySnap.docs.map(d => ({ id: d.id, ...d.data() }));

      const backupObj = {
        exportDate: new Date().toISOString(),
        cards: cardsData,
        monthlyArchive: monthlyData
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObj, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `Backup_QuanLyThe_${getCurrentCycleString().replace('/','-')}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    // Modal Thống Kê
    window.openStatsModal = async () => {
      const snapshot = await getDocs(collection(db, "monthly_archive"));
      const container = document.getElementById("stats-content");

      if (snapshot.empty) {
        container.innerHTML = `<p class="text-center text-slate-400 py-6">Chưa có dữ liệu chốt sổ các tháng để thống kê.</p>`;
        openModal('modal-stats');
        return;
      }

      const records = snapshot.docs.map(d => d.data());
      const yearStats = {};
      const monthStats = {};

      records.forEach(r => {
        const year = r.cycleYear || (r.month ? r.month.split('/')[1] : 'Khác');
        const monthKey = r.month || 'Khác';
        
        yearStats[year] = (yearStats[year] || 0) + (r.totalSpent || 0);
        monthStats[monthKey] = (monthStats[monthKey] || 0) + (r.totalSpent || 0);
      });

      let html = `
        <div class="bg-slate-900 border border-slate-700/80 p-3.5 rounded-lg space-y-2">
          <h3 class="font-bold text-indigo-400 text-sm">📅 Thống Kê Tổng Chi Theo Năm</h3>
          <div class="space-y-1">
      `;
      for (const [yr, total] of Object.entries(yearStats)) {
        html += `<div class="flex justify-between border-b border-slate-800 pb-1"><span>Năm ${yr}:</span> <span class="font-bold text-emerald-400">${total.toLocaleString('vi-VN')} đ</span></div>`;
      }
      html += `</div></div>`;

      html += `
        <div class="bg-slate-900 border border-slate-700/80 p-3.5 rounded-lg space-y-2 mt-4">
          <h3 class="font-bold text-amber-400 text-sm">📆 Thống Kê Chi Tiêu Theo Tháng</h3>
          <div class="space-y-1">
      `;
      for (const [m, total] of Object.entries(monthStats)) {
        html += `<div class="flex justify-between border-b border-slate-800 pb-1"><span>${m}:</span> <span class="font-bold text-slate-200">${total.toLocaleString('vi-VN')} đ</span></div>`;
      }
      html += `</div></div>`;

      container.innerHTML = html;
      openModal('modal-stats');
    };

    // Cập nhật chi tiêu
    window.addSpending = async (id, currentVal) => {
      const input = document.getElementById(`spend-input-${id}`);
      const noteInput = document.getElementById(`spend-note-${id}`);
      const val = Number(input.value);
      const note = noteInput.value.trim() || "Chuyển khoản / Quẹt thẻ";

      if (val) {
        const cardRef = doc(db, "cards", id);
        const cardSnap = await getDoc(cardRef);
        const history = cardSnap.data().history || [];

        const newLog = {
          amount: val,
          note: note,
          timestamp: new Date().toLocaleString('vi-VN')
        };

        await updateDoc(cardRef, {
          currentSpending: currentVal + val,
          history: [newLog, ...history]
        });

        input.value = "";
        noteInput.value = "";
      }
    };

    // Lịch sử giao dịch
    window.viewHistory = async (id, cardName) => {
      document.getElementById("history-modal-title").innerText = `Lịch Sử Giao Dịch: ${cardName}`;
      const cardSnap = await getDoc(doc(db, "cards", id));
      const history = cardSnap.data().history || [];
      const container = document.getElementById("history-list");

      if (history.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-400 py-6 text-xs">Chưa có giao dịch nào được ghi nhận.</p>`;
      } else {
        container.innerHTML = history.map((item, idx) => `
          <div class="bg-slate-900 border border-slate-700/60 rounded-lg p-3 flex justify-between items-center text-xs">
            <div>
              <p class="font-bold text-emerald-400">+${item.amount.toLocaleString('vi-VN')} đ</p>
              <p class="text-slate-300 mt-0.5">${item.note}</p>
              <p class="text-slate-500 text-[10px]">${item.timestamp}</p>
            </div>
            <button onclick="deleteHistoryItem('${id}', ${idx})" class="text-rose-400 hover:text-rose-300 text-xs px-2 py-1 bg-rose-500/10 rounded">Xóa</button>
          </div>
        `).join('');
      }
      openModal('modal-history');
    };

    window.deleteHistoryItem = async (cardId, index) => {
      if (confirm("Xóa giao dịch này và trừ tiền tương ứng?")) {
        const cardRef = doc(db, "cards", cardId);
        const cardSnap = await getDoc(cardRef);
        const data = cardSnap.data();
        const history = data.history || [];
        const deletedItem = history[index];

        history.splice(index, 1);
        const newSpending = Math.max(0, (data.currentSpending || 0) - deletedItem.amount);

        await updateDoc(cardRef, {
          currentSpending: newSpending,
          history: history
        });
        viewHistory(cardId, data.name);
      }
    };

    window.openMonthlyHistory = () => {
      onSnapshot(collection(db, "monthly_archive"), (snapshot) => {
        const container = document.getElementById("monthly-history-list");
        if (snapshot.empty) {
          container.innerHTML = `<p class="text-center text-slate-400 py-6 text-xs">Chưa có dữ liệu chốt sổ tháng nào.</p>`;
        } else {
          container.innerHTML = snapshot.docs.map(docSnap => {
            const d = docSnap.data();
            const isReached = d.totalSpent >= d.target;
            return `
              <div class="bg-slate-900 border border-slate-700 p-3 rounded-lg text-xs space-y-1">
                <div class="flex justify-between font-bold">
                  <span class="text-indigo-400">${d.cardName} (${d.month})</span>
                  <span class="${isReached ? 'text-emerald-400' : 'text-amber-400'}">${isReached ? '🎉 Đạt Mốc' : 'Chưa Đạt'}</span>
                </div>
                <div class="flex justify-between text-slate-300">
                  <span>Tổng chi: ${d.totalSpent.toLocaleString('vi-VN')} đ</span>
                  <span>Mốc: ${d.target.toLocaleString('vi-VN')} đ</span>
                </div>
                <p class="text-[10px] text-slate-500">Chốt lúc: ${d.closedAt}</p>
              </div>
            `;
          }).join('');
        }
        openModal('modal-monthly');
      });
    };

    function calculateRewardEstimate(cardName, current, target) {
      const name = cardName.toUpperCase();
      const percent = (current / target) * 100;
      if (name.includes('SUPER CARD')) {
        const points = Math.min(Math.floor((current / target) * 500000), 500000);
        return `${points.toLocaleString('vi-VN')} / 500.000 điểm`;
      }
      if (percent >= 100) return "🎉 Đã ĐẠT MỐC Hoàn Thưởng!";
      return `Đạt ${percent.toFixed(1)}% mốc thưởng`;
    }

    function getDaysUntilStatement(statementDayInput) {
      const today = new Date();
      const currentYear = today.getFullYear();
      const currentMonth = today.getMonth();
      const todayDate = today.getDate();

      const lastDayOfCurrentMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      let actualStatementDay = Math.min(statementDayInput, lastDayOfCurrentMonth);
      let targetDate = new Date(currentYear, currentMonth, actualStatementDay);

      if (todayDate > actualStatementDay) {
        const lastDayOfNextMonth = new Date(currentYear, currentMonth + 2, 0).getDate();
        const nextStatementDay = Math.min(statementDayInput, lastDayOfNextMonth);
        targetDate = new Date(currentYear, currentMonth + 1, nextStatementDay);
      }

      const diffTime = targetDate.getTime() - new Date(currentYear, currentMonth, todayDate).getTime();
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return { daysLeft: diffDays, isToday: diffDays === 0 };
    }

    // Modal Helpers
    window.openAddModal = () => {
      document.getElementById("card-form").reset();
      document.getElementById("card-id").value = "";
      document.getElementById("modal-title").innerText = "Thêm Thẻ Tín Dụng";
      openModal('modal-add');
    };

    window.editCard = (id, name, target, statementDay, rewardNote, customColor = '') => {
      document.getElementById("card-id").value = id;
      document.getElementById("card-name").value = name;
      document.getElementById("card-target").value = target;
      document.getElementById("card-statement").value = statementDay;
      document.getElementById("card-color").value = customColor || 'black';
      document.getElementById("card-reward").value = rewardNote;
      document.getElementById("modal-title").innerText = "Chỉnh Sửa Thẻ";
      openModal('modal-add');
    };

    window.deleteCard = async (id) => {
      if (confirm("Bạn có chắc chắn muốn xóa thẻ này?")) {
        await deleteDoc(doc(db, "cards", id));
      }
    };

    window.openModal = (id) => document.getElementById(id).classList.remove("hidden");
    window.closeModal = (id) => document.getElementById(id).classList.add("hidden");
